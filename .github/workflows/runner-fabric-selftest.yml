name: Runner Fabric Selftest

on:
  pull_request:
    branches: [main]
    paths:
      - 'execution/runner-fabric-v1.json'
      - 'docs/runner-fabric-v1.md'
      - 'scripts/verify_runner_fabric.py'
      - 'tests/test_runner_fabric.py'
      - 'tests/test_runner_fabric_doctor.py'
      - '.github/workflows/polyrepo-integration-gate.yml'
      - '.github/workflows/org-wide-suite.yml'
      - '.github/workflows/runner-fabric-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-fabric-selftest-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - id: python
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-python@v7
        continue-on-error: true
        with:
          python-version: '3.12'

      - id: readiness
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.checkout.outcome }}' != 'success' || '${{ steps.python.outcome }}' != 'success' ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GitHub-hosted bootstrap selftest provisioning unavailable; fabric selftest is neutral-skipped.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Verify runner fabric contract
        if: steps.readiness.outputs.ready == 'true'
        run: python scripts/verify_runner_fabric.py

      - name: Unit test runner fabric verifier and metrics
        if: steps.readiness.outputs.ready == 'true'
        run: >-
          python -m unittest
          tests.test_runner_fabric
          tests.test_runner_fabric_doctor
          tests.test_runner_fabric_metrics
          tests.test_runner_policy_audit
          -v

  capacity-probe:
    name: organization-visible-aftergraph-ci
    runs-on: [self-hosted, Linux, X64, aftergraph-ci]
    timeout-minutes: 5
    steps:
      - name: Verify runner lane
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test -n "${RUNNER_NAME:-}"
          case "${RUNNER_NAME}" in
            aftergraph-ci-*) ;;
            *)
              echo "runner name does not match the governed aftergraph-ci prefix" >&2
              exit 1
              ;;
          esac
          test "$(id -u)" -ne 0
          echo "RUNNER_FABRIC_JOB=PASS"
          echo "RUNNER_FABRIC_OS=Linux"
          echo "RUNNER_FABRIC_ARCH=X64"
          echo "RUNNER_FABRIC_NAME_PREFIX=aftergraph-ci"
          echo "RUNNER_FABRIC_ROOTLESS=true"
