name: Seed Aftergraph discussions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed-discussions.yml
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: Aftergraph
      REPO: .github
    steps:
      - name: Resolve repository and discussion categories
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:100){nodes{id name slug}} discussions(first:100){nodes{title url}}}}'
          gh api graphql -f query="$query" -F owner="$OWNER" -F name="$REPO" > /tmp/discussions.json
          repo_id=$(jq -r '.data.repository.id' /tmp/discussions.json)
          general_id=$(jq -r '.data.repository.discussionCategories.nodes[] | select(.slug=="general") | .id' /tmp/discussions.json | head -n1)
          ideas_id=$(jq -r '.data.repository.discussionCategories.nodes[] | select(.slug=="ideas") | .id' /tmp/discussions.json | head -n1)
          test -n "$repo_id" && test "$repo_id" != "null"
          test -n "$general_id" && test "$general_id" != "null"
          test -n "$ideas_id" && test "$ideas_id" != "null"
          echo "repo_id=$repo_id" >> "$GITHUB_OUTPUT"
          echo "general_id=$general_id" >> "$GITHUB_OUTPUT"
          echo "ideas_id=$ideas_id" >> "$GITHUB_OUTPUT"

      - name: Seed canonical discussions idempotently
        shell: bash
        env:
          REPO_ID: ${{ steps.resolve.outputs.repo_id }}
          GENERAL_ID: ${{ steps.resolve.outputs.general_id }}
          IDEAS_ID: ${{ steps.resolve.outputs.ideas_id }}
        run: |
          set -euo pipefail

          read_seed() {
            gh api "repos/$OWNER/$REPO/contents/$1?ref=$GITHUB_SHA" --jq '.content' | base64 --decode
          }

          create_discussion() {
            local category_id="$1"
            local title="$2"
            local seed_path="$3"
            local exists body mutation
            exists=$(jq --arg title "$title" '[.data.repository.discussions.nodes[] | select(.title==$title)] | length' /tmp/discussions.json)
            if [ "$exists" -gt 0 ]; then
              echo "Already exists: $title"
              return 0
            fi
            body=$(read_seed "$seed_path")
            mutation='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{id url title}}}'
            gh api graphql -f query="$mutation" -F repositoryId="$REPO_ID" -F categoryId="$category_id" -f title="$title" -f body="$body"
          }

          create_discussion "$GENERAL_ID" "Welcome to Aftergraph" ".github/discussion-seeds/welcome.md"
          create_discussion "$IDEAS_ID" "What comes after Graph Engineering?" ".github/discussion-seeds/after-graph.md"
          create_discussion "$GENERAL_ID" "SPEC-001 Mission Contract: Request for Implementations" ".github/discussion-seeds/spec-001.md"
