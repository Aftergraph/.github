# Test the candidate source code, not the old pinned review engine.
# pull_request uses a read-only checkout of the PR merge ref.
name: Sentinel source tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/agent_review.py'
      - 'policies/**'
      - 'tests/**'
      - '.github/workflows/sentinel-source-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/agent_review.py'
      - 'policies/**'
      - 'tests/**'
      - '.github/workflows/sentinel-source-tests.yml'

permissions:
  contents: read

jobs:
  sentinel-source-tests:
    name: sentinel-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source compilation
        run: python3 -m compileall -q scripts tests
      - name: Run full Sentinel and runner-fabric regression suite
        run: python3 -m unittest discover -s tests -v
