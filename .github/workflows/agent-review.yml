name: Agent review (slice 3 final, COMMENT-only emit-only)

# Slice 3 (final) of the code-review agent. READ-ONLY + COMMENT-only
# permanently by design:
#   - pull_request_target runs on the BASE revision only (checkout pins the
#     base SHA; the untrusted PR head is never checked out).
#   - Job permissions are read-only (contents/checks/pull-requests). No
#     `write` scopes anywhere in this file.
#   - The review job emits the review packet JSON to stdout only. It posts
#     NOTHING: no PR comments, no approvals, no reviews writes, no commit
#     statuses, no governance writes. Verdicts are emitted as `agent_verdict`
#     (MERGEABLE/BLOCKED) plus a human COMMENT body composed by the caller;
#     this slice never posts that comment itself.
#   - The push-audit job is DETECTIVE and NON-PREVENTIVE: on push to main it
#     verifies the head has a PR merge-commit author (associated PR via the
#     commits/<sha>/pulls API). Non-PR heads append a finding to the packet
#     stream (JSON on stdout) and FAIL THE JOB VISIBLY (exit 1). The push
#     already landed; the job flags it, it does not prevent it. Forced
#     pushes by an admin remain possible; flagged, not prevented.
#
# Triggers:
#   - pull_request_target: opened / synchronize / ready_for_review
#   - merge_group: checks_requested (merge-queue gate; selftest is the gate,
#     review emits merge-queue context only — no PR URL exists there)
#   - push to main: push-audit job only (detective)
#   - workflow_dispatch with a PR URL for manual re-runs.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_url:
        description: >-
          Full PR URL, e.g. https://github.com/Aftergraph/trust-gateway/pull/83
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  review:
    name: review (read-only, emit-only)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned action SHA; pinned base SHA (never the PR head).
      - name: Checkout base (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Run agent review (emits packet to stdout only)
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        uses: ./actions/agent-review
        with:
          pr-url: ${{ github.event.pull_request.html_url || inputs.pr_url }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge-queue context (emit-only, no PR URL on merge_group)
        if: github.event_name == 'merge_group'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; print(json.dumps({'event': 'merge_group', 'head_sha': '${{ github.event.merge_group.head_sha }}', 'base_sha': '${{ github.event.merge_group.base_sha }}', 'note': 'merge-queue gate: selftest job is the blocking check; review packet is per-PR (see docs/agent-review.md)'}))"

  selftest:
    name: selftest (agent unit tests, merge-queue gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run agent unit tests
        shell: bash
        run: python3 -m unittest tests.test_agent_review tests.test_slice3 -v

  push-audit:
    name: push-audit (direct-to-main detective audit)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pushed head (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned gh CLI
        shell: bash
        env:
          GH_VERSION: "2.46.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gh.deb \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/gh.deb
          gh --version

      # Detective, non-preventive: queries the head commit's associated PRs
      # and fails visibly (exit 1) on direct pushes. Emits the finding JSON
      # to stdout (packet stream); posts NOTHING.
      - name: Audit main head for PR association (fails visibly on direct push)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls?per_page=100" > /tmp/associated_prs.json
          python3 scripts/audit_push.py \
            --head-sha "${{ github.sha }}" \
            --associated-prs /tmp/associated_prs.json \
            --run-id "${{ github.run_id }}"
