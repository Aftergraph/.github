name: Sentinel gate (read-only)

# Slice 3 of the code-review agent. READ-ONLY and COMMENT-ONLY permanently:
#   - pull_request_target runs on the BASE revision only (checkout pins the
#     base SHA; the untrusted PR head is never checked out).
#   - Job permissions are read-only (contents/checks/pull-requests).
#   - The job emits the review packet JSON to stdout plus a per-PR packet
#     file (docs/evidence/agent-review/<repo>-<num>-<shortsha>.json)
#     uploaded as a workflow artifact. It posts NOTHING: no PR comments,
#     no approvals, no review writes, no commit statuses, no governance
#     writes. Packet files land in the repo via a later slice, never here.
#
# Triggers:
#   - pull_request_target: opened / synchronize / ready_for_review
#   - workflow_dispatch with a PR URL for manual re-runs.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_url:
        description: >-
          Full PR URL, e.g. https://github.com/Aftergraph/trust-gateway/pull/83
        required: true
        type: string
  # Called by per-repo caller workflows (see docs/agent-review.md).
  # Callers trigger on pull_request_target + push; merge_group reaches
  # the engine once callers pass pr_url (future slice).
  workflow_call:
    inputs:
      runner_labels:
        # JSON array of runs-on labels. Default keeps GitHub-hosted
        # behaviour; private repos whose hosted jobs are blocked by the
        # Actions billing lock pass '["self-hosted","linux","x64","aftergraph-ci"]'.
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      token:
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  review:
    name: review (read-only)
    # PR/queue events only: push events are handled by push_audit below.
    if: github.event_name != 'push'
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      # Engine self-checkout: under workflow_call, ./ paths resolve in
      # the CALLER repo, which has no engine files. Pin the engine repo
      # by exact SHA (never a branch). Bump this pin whenever
      # actions/, scripts/ or policies/ change (see docs/agent-review.md).
      - name: Checkout engine (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/.github
          ref: e5d92f1023ff14c9ae3d904dce1102f6eba2d4ac
          path: sentinel-engine
          persist-credentials: false

      - name: Run agent review (emits packet to stdout only)
        uses: ./sentinel-engine/actions/agent-review
        with:
          pr-url: ${{ github.event.pull_request.html_url || inputs.pr_url }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push_audit:
    name: push audit (direct-to-main detection, detective only)
    # Detective, not preventive: a NON_PR_HEAD finding fails this job
    # visibly but cannot block a push. Repos without enforceable branch
    # protection rely on this signal plus human response.
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      # The audit reads commits/{sha}/pulls, which needs pull-requests read on
      # private repositories (public repos allow it with contents: read alone).
      pull-requests: read
    steps:
      - name: Checkout engine (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/.github
          ref: e5d92f1023ff14c9ae3d904dce1102f6eba2d4ac
          path: sentinel-engine
          persist-credentials: false

      - name: Audit main head for PR provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR/commit association indexes seconds after push; retry before
          # crying NON_PR_HEAD so legit merge pushes are not flagged.
          # Fail-closed is preserved: persistent absence still exits 1.
          attempt=1
          while [ $attempt -le 4 ]; do
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | {number, state, merged_at: .merged_at}]' > /tmp/prs.json
            if python3 sentinel-engine/scripts/agent_review.py --audit-push "${{ github.sha }}" \
              --prs /tmp/prs.json; then
              exit 0
            fi
            echo "audit attempt $attempt inconclusive; waiting 30s" >&2
            attempt=$((attempt + 1))
            sleep 30
          done
          exit 1

  selftest:
    name: selftest (agent_review unit tests)
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout engine (pinned SHA only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/.github
          ref: e5d92f1023ff14c9ae3d904dce1102f6eba2d4ac
          path: sentinel-engine
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run agent_review tests
        shell: bash
        working-directory: sentinel-engine
        run: python3 -m unittest discover -s tests -v
