name: Brand Assets
on:
  pull_request:
    paths: ["brand/**", "profile/**", "scripts/verify_brand_assets.py", "scripts/test_verify_brand_assets.py", ".github/workflows/brand-assets.yml"]
  push:
    branches: [main]
    paths: ["brand/**", "profile/**", "scripts/verify_brand_assets.py", "scripts/test_verify_brand_assets.py"]
permissions:
  contents: read
jobs:
  verify-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python scripts/test_verify_brand_assets.py
      - name: Validate brand JSON
        run: |
          python -c "import json; json.load(open('brand/manifest.json')); json.load(open('brand/registry.json')); json.load(open('brand/tokens.json')); print('brand JSON OK')"
      - name: Validate SVG masters
        run: |
          python -c "
          from xml.etree import ElementTree as ET
          from pathlib import Path
          for p in Path('brand').rglob('*.svg'):
              ET.parse(p)
          print('all brand SVGs parse OK')
          "