name: Brand Assets
on:
  pull_request:
    paths: ["brand/**","profile/**","scripts/verify_brand_assets.py",".github/workflows/brand-assets.yml"]
  push:
    branches: [main]
    paths: ["brand/**","profile/**","scripts/verify_brand_assets.py"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/verify_brand_assets.py
