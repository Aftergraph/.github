name: Polyrepo Integration Gate

on:
  workflow_call:
    inputs:
      target_repo:
        required: true
        type: string
      target_ref:
        required: false
        type: string
        default: 'main'
      siblings:
        required: false
        type: string
        default: ''
      governance_ref:
        required: false
        type: string
        default: 'main'
      aie_ref:
        required: false
        type: string
        default: 'main'
      works_ref:
        required: false
        type: string
        default: 'main'
      wiv2_ref:
        required: false
        type: string
        default: 'main'
      isr_ref:
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

concurrency:
  group: polyrepo-${{ inputs.target_repo }}-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: integration
    runs-on: [self-hosted, Linux, X64, aftergraph-ci]
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - name: Checkout target (${{ inputs.target_repo }})
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/${{ inputs.target_repo }}
          ref: ${{ inputs.target_ref }}
          path: ${{ inputs.target_repo }}
          persist-credentials: false
          clean: true

      - name: Checkout after-graph-governance
        if: contains(inputs.siblings, 'after-graph-governance')
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/after-graph-governance
          ref: ${{ inputs.governance_ref }}
          path: after-graph-governance
          persist-credentials: false
          clean: true

      - name: Checkout AIE
        if: contains(inputs.siblings, 'aie')
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/aie
          ref: ${{ inputs.aie_ref }}
          path: aie
          persist-credentials: false
          clean: true

      - name: Checkout WORKS
        if: contains(inputs.siblings, 'works-execution')
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/works-execution
          ref: ${{ inputs.works_ref }}
          path: works-execution
          persist-credentials: false
          clean: true

      - name: Checkout work-intelligence-v2
        if: contains(inputs.siblings, 'work-intelligence-v2')
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/work-intelligence-v2
          ref: ${{ inputs.wiv2_ref }}
          path: work-intelligence-v2
          persist-credentials: false
          clean: true

      - name: Checkout intelligence-systems-research
        if: contains(inputs.siblings, 'intelligence-systems-research')
        uses: actions/checkout@v7
        with:
          repository: Aftergraph/intelligence-systems-research
          ref: ${{ inputs.isr_ref }}
          path: intelligence-systems-research
          persist-credentials: false
          clean: true

      - name: Provision Node 24
        if: inputs.target_repo == 'trust-gateway'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Provision Python 3.12
        if: inputs.target_repo == 'aie' || inputs.target_repo == 'work-intelligence-v2' || inputs.target_repo == 'intelligence-systems-research'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Provision Go
        if: inputs.target_repo == 'works-execution'
        uses: actions/setup-go@v7
        with:
          go-version-file: works-execution/go.mod
          cache: false

      - name: Set workspace contract env
        shell: bash
        run: |
          set -euo pipefail
          echo "AFTERGRAPH_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "GOVERNANCE_ROOT=$GITHUB_WORKSPACE/after-graph-governance" >> "$GITHUB_ENV"
          echo "GOVERNANCE_CONTRACTS_PATH=$GITHUB_WORKSPACE/after-graph-governance/docs/contracts/frozen" >> "$GITHUB_ENV"
          echo "GOVERNANCE_DIR=$GITHUB_WORKSPACE/after-graph-governance" >> "$GITHUB_ENV"
          echo "AIE_RUNTIME_PATH=$GITHUB_WORKSPACE/aie" >> "$GITHUB_ENV"
          echo "AIE_ROOT=$GITHUB_WORKSPACE/aie" >> "$GITHUB_ENV"
          echo "WORKS_ROOT=$GITHUB_WORKSPACE/works-execution" >> "$GITHUB_ENV"
          echo "TG_ROOT=$GITHUB_WORKSPACE/trust-gateway" >> "$GITHUB_ENV"
          echo "WIV2_ROOT=$GITHUB_WORKSPACE/work-intelligence-v2" >> "$GITHUB_ENV"
          echo "ISR_ROOT=$GITHUB_WORKSPACE/intelligence-systems-research" >> "$GITHUB_ENV"

      - name: Assert governance contracts present
        if: contains(inputs.siblings, 'after-graph-governance')
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GOVERNANCE_ROOT"
          test -f "$GOVERNANCE_CONTRACTS_PATH/policy.token.schema.json"
          test -f "$GOVERNANCE_CONTRACTS_PATH/identity.schema.json"
          test -f "$GOVERNANCE_CONTRACTS_PATH/evidence.schema.schema.json"
          test -f "$GOVERNANCE_CONTRACTS_PATH/kernel.budget.schema.json"
          test -f "$GOVERNANCE_ROOT/docs/contracts/mission-state/1.0.json"

      - name: Run integration suite (${{ inputs.target_repo }})
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$TARGET_REPO"
          case "$TARGET_REPO" in
            trust-gateway)
              npm ci --no-audit --no-fund
              npm test
              ;;
            aie)
              python -m pip install -e '.[dev,otel]'
              python -m compileall -q src interop/s1
              python -m pytest -q
              ;;
            work-intelligence-v2)
              python -m pip install -e ".[dev]"
              python -m pip install ruff
              ruff check src/ tests/
              python -m pytest --tb=short -q
              ;;
            works-execution)
              go mod download
              go build ./...
              go vet ./...
              go test ./... -count=1
              ;;
            intelligence-systems-research)
              python -m pip install pytest httpx
              if [ -d "$GITHUB_WORKSPACE/aie" ]; then
                python -m pip install -e "$GITHUB_WORKSPACE/aie"
              fi
              python -m pytest -v --tb=short
              ;;
            *)
              echo "Unknown target_repo: $TARGET_REPO" >&2
              exit 1
              ;;
          esac

      - name: Exact-head receipt
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git -C "$GITHUB_WORKSPACE/$TARGET_REPO" rev-parse HEAD)"
          printf 'EXACT_HEAD=%s\n' "$EXACT_HEAD"
          printf 'TARGET_REPO=%s\n' "$TARGET_REPO"
          for repo in after-graph-governance aie works-execution work-intelligence-v2 intelligence-systems-research; do
            if [ -d "$GITHUB_WORKSPACE/$repo/.git" ]; then
              printf '%s=%s\n' "$(echo "$repo" | tr '[:lower:]-' '[:upper:]_')" "$(git -C "$GITHUB_WORKSPACE/$repo" rev-parse HEAD)"
            fi
          done
