title: "[RFC] "
body:
  - type: textarea
    id: target
    attributes:
      label: Target contract or specification
      description: Name the spec, schema, invariant, registry, protocol binding, or governance rule affected.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What interoperability, correctness, usability, security, or evolution problem requires a change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed semantics
      description: State the behavior precisely, including MUST/SHOULD/MAY where appropriate.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Schema/version impact, downgrade behavior, namespace impact, and migration path.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and authority implications
      description: What new authority, trust, abuse, or containment properties appear?
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: Conformance test
      description: Describe at least one test vector that would prove the proposal is implemented correctly.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
