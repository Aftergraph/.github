name: "Agent review (slice 2, read-only)"

description: >-
  Slice 2 of the code-review agent. READ-ONLY and COMMENT-ONLY permanently:
  collects the PR head SHA, live check runs, approval/binding state, and
  seam evidence via read-only GitHub API calls, runs scripts/agent_review.py
  (C1 delta-vs-reviewed-head, C2 pinned-checks gate, C3 approval/binding,
  C4 seam checks), and emits the review packet JSON to stdout plus a
  per-PR packet file uploaded as a workflow artifact. Posts NOTHING: no
  comments, no approvals, no review writes, no commit statuses, no
  governance writes.

inputs:
  pr-url:
    description: "Full PR URL, e.g. https://github.com/Aftergraph/trust-gateway/pull/83"
    required: true
  agent-version:
    description: "Agent version recorded in the packet agent_review block."
    required: false
    default: "0.2.0"
  policy:
    description: "Repo-relative path to the pinned-checks policy file."
    required: false
    default: "policies/pinned-checks.json"
  seam-rules:
    description: "Repo-relative path to the seam-rules policy file."
    required: false
    default: "policies/seam-rules.json"
  emit-dir:
    description: "Workspace directory for the per-PR packet file."
    required: false
    default: "docs/evidence/agent-review"

runs:
  using: composite
  steps:
    - name: Set up pinned Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install pinned gh CLI
      shell: bash
      env:
        GH_VERSION: "2.46.0"
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/gh.deb \
          "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.deb"
        sudo dpkg -i /tmp/gh.deb
        gh --version

    - name: Collect PR data (read-only API)
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        PR_URL: ${{ inputs.pr-url }}
      run: |
        set -euo pipefail
        test -n "${GH_TOKEN:-}" || { echo "GH_TOKEN is required" >&2; exit 1; }
        python3 - "$PR_URL" <<'EOF'
        import base64, fnmatch, json, re, subprocess, sys

        url = sys.argv[1]
        m = re.fullmatch(r"https://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/pull/([0-9]+)", url)
        if not m:
            print(f"Invalid PR URL (must be https://github.com/<owner>/<repo>/pull/<n>): {url}",
                  file=sys.stderr)
            sys.exit(1)
        owner, repo, number = m.groups()

        def api(path):
            out = subprocess.run(["gh", "api", path], capture_output=True, text=True, check=True)
            return json.loads(out.stdout)

        pr = api(f"repos/{owner}/{repo}/pulls/{number}")
        head_sha = pr["head"]["sha"]
        runs = api(f"repos/{owner}/{repo}/commits/{head_sha}/check-runs?per_page=100")
        reviews = api(f"repos/{owner}/{repo}/pulls/{number}/reviews?per_page=100")
        with open("/tmp/agent_review_pr.json", "w", encoding="utf-8") as f:
            json.dump({"owner": owner, "repo": repo, "number": int(number),
                       "pr": pr, "check_runs": runs.get("check_runs", []),
                       "reviews": reviews}, f)

        # C3 binding inputs (all read-only).
        commit = api(f"repos/{owner}/{repo}/git/commits/{head_sha}")
        pushed_at = ((commit.get("committer") or {}).get("date")
                     or (commit.get("author") or {}).get("date"))
        gql = subprocess.run(
            ["gh", "api", "graphql", "-f", f"owner={owner}",
             "-f", f"name={repo}", "-F", f"number={number}",
             "-f", "query=query($owner:String!,$name:String!,$number:Int!){"
             "repository(owner:$owner,name:$name){pullRequest(number:$number){"
             "reviewThreads(first:100){nodes{isResolved}}}}}"],
            capture_output=True, text=True, check=True)
        threads = (gql.stdout and json.loads(gql.stdout)["data"]["repository"]
                   ["pullRequest"]["reviewThreads"]["nodes"])
        unresolved = sum(1 for t in threads if not t.get("isResolved"))

        try:
            blob = api(f"repos/{owner}/{repo}/contents/.github/CODEOWNERS")
            owners_text = base64.b64decode(blob["content"]).decode("utf-8", "replace")
        except subprocess.CalledProcessError:
            owners_text = ""
        patterns = []
        for line in owners_text.splitlines():
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            parts = line.split()
            if len(parts) >= 2:
                patterns.append(parts[0])

        def owner_covers(pattern, path):
            pat = pattern[1:] if pattern.startswith("/") else pattern
            if pat.endswith("/"):
                return path == pat[:-1] or path.startswith(pat)
            base = path.rsplit("/", 1)[-1]
            return (fnmatch.fnmatchcase(base, pat)
                    or fnmatch.fnmatchcase(path, pat)
                    or fnmatch.fnmatchcase(path, pat.rstrip("*") + "*"))

        files_out = subprocess.run(
            ["gh", "pr", "view", url, "--json", "files",
             "-q", ".files[].path"],
            capture_output=True, text=True, check=True)
        changed = [p for p in files_out.stdout.splitlines() if p]
        approvals = [r for r in reviews if r.get("state") == "APPROVED"]
        codeowners_matched = (
            bool(patterns) and bool(approvals)
            and all(any(owner_covers(pat, path) for pat in patterns)
                    for path in changed))

        binding = {
            "head_commit_pushed_at": pushed_at,
            "reviews": [{"author": (r.get("user") or {}).get("login"),
                         "state": r.get("state"),
                         "submitted_at": r.get("submitted_at")}
                        for r in reviews],
            "unresolved_conversations": unresolved,
            "codeowners_matched": codeowners_matched,
            "labels": [l["name"] for l in pr.get("labels", [])],
        }
        with open("/tmp/agent_review_binding.json", "w", encoding="utf-8") as f:
            json.dump(binding, f, indent=2, sort_keys=True)

        # C4 seam evidence: optional fenced ```seam-evidence block in the
        # PR body. Absent => empty claims (no seam assertions to verify).
        # Present-but-malformed => fail-closed shape error downstream.
        body = pr.get("body") or ""
        fence = re.search(r"```seam-evidence\s*(\{.*?\})\s*```", body, re.S)
        if fence is None:
            seams = {"cited_ids": [], "ledger": {}, "records": [],
                     "contract_pins": {}, "new_identifiers": [],
                     "memory_authority_claims": []}
        else:
            try:
                parsed = json.loads(fence.group(1))
                seams = parsed if isinstance(parsed, dict) else {
                    "cited_ids": "!!malformed!!"}
            except json.JSONDecodeError:
                seams = {"cited_ids": "!!malformed!!"}
        with open("/tmp/agent_review_seams.json", "w", encoding="utf-8") as f:
            json.dump(seams, f, indent=2, sort_keys=True)
        print(f"collected {owner}/{repo}#{number} head {head_sha}", file=sys.stderr)
        EOF

    - name: Emit review packet (stdout plus per-PR file)
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        PR_URL: ${{ inputs.pr-url }}
      run: |
        set -euo pipefail
        REVIEW_DECISION=$(gh pr view "$PR_URL" --json reviewDecision -q '.reviewDecision // "UNKNOWN"')
        python3 - "$REVIEW_DECISION" "${{ inputs.policy }}" <<'EOF'
        import json, sys

        review_decision, policy_path = sys.argv[1:3]
        bundle = json.load(open("/tmp/agent_review_pr.json", encoding="utf-8"))
        pr, owner, repo = bundle["pr"], bundle["owner"], bundle["repo"]
        head_sha = pr["head"]["sha"]
        policy = json.load(open(policy_path, encoding="utf-8"))
        pinned = (policy.get("checks") or {}).get(repo, [])

        checks = [{"name": c["name"],
                   "status": (c.get("status") or "UNKNOWN").upper(),
                   "conclusion": (c.get("conclusion").upper()
                                   if c.get("conclusion") else None)}
                  for c in bundle["check_runs"]]
        by_name = {c["name"]: c for c in checks}
        all_green = all(by_name.get(n, {}).get("status") == "COMPLETED"
                        and by_name.get(n, {}).get("conclusion") == "SUCCESS"
                        for n in pinned) if pinned else False

        mergeable = pr.get("mergeable")
        packet = {
            "repo": repo,
            "number": pr["number"],
            "url": pr["html_url"],
            "title": pr["title"],
            "head_sha": head_sha,
            "head_branch": pr["head"]["ref"],
            "base": pr["base"]["ref"],
            "mergeable": ("MERGEABLE" if mergeable is True
                          else "NOT_MERGEABLE" if mergeable is False else "UNKNOWN"),
            "merge_state": str(pr.get("mergeable_state", "unknown")).upper(),
            "review_decision": review_decision,
            "diffstat": {"additions": pr.get("additions", 0),
                         "deletions": pr.get("deletions", 0),
                         "files": pr.get("changed_files", 0)},
            "checks": checks,
            "reviews": [{"author": r["user"]["login"], "state": r["state"]}
                        for r in bundle["reviews"]],
            "all_required_checks_green": all_green,
        }
        with open("/tmp/agent_review_packet.json", "w", encoding="utf-8") as f:
            json.dump(packet, f, indent=2, sort_keys=True)

        live = {"checks": checks}
        with open("/tmp/agent_review_live_checks.json", "w", encoding="utf-8") as f:
            json.dump(live, f)
        EOF
        python3 scripts/agent_review.py \
          --packet /tmp/agent_review_packet.json \
          --current-head "$(python3 -c "import json;print(json.load(open('/tmp/agent_review_pr.json'))['pr']['head']['sha'])")" \
          --checks /tmp/agent_review_live_checks.json \
          --policy "${{ inputs.policy }}" \
          --binding /tmp/agent_review_binding.json \
          --seams /tmp/agent_review_seams.json \
          --seam-rules "${{ inputs.seam-rules }}" \
          --emit-dir "${{ inputs.emit-dir }}" \
          --agent-name "agent-review" \
          --agent-version "${{ inputs.agent-version }}" \
          --run-id "${{ github.run_id }}"

    - name: Upload packet file artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: agent-review-packet
        path: ${{ inputs.emit-dir }}/*.json
        if-no-files-found: error
